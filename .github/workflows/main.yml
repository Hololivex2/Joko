name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract zip and structure project
      run: |
        echo "Looking for zip files..."
        ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE. Extracting..."
          unzip -o "$ZIP_FILE" -d .
        fi
        
        # If project is inside a subfolder, bring it to root
        SETTINGS_FILE=$(find . -mindepth 2 -name "settings.gradle.kts" | head -n 1)
        if [ -n "$SETTINGS_FILE" ]; then
          DIR=$(dirname "$SETTINGS_FILE")
          echo "Moving files from $DIR to root..."
          cp -rn "$DIR"/* . || true
        fi

        # Fix top-level build.gradle.kts to avoid missing libs catalog error
        cat << 'EOF' > build.gradle.kts
        // Top-level build file
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FramePilot-APK
        path: app/build/outputs/apk/debug/*.apk
