name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Ensure Project Structure
      run: |
        # Only unzip if project files are not at root
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "app/build.gradle.kts" ]; then
          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d .
          fi
          SETTINGS_FILE=$(find . -mindepth 2 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            DIR=$(dirname "$SETTINGS_FILE")
            echo "Moving files from $DIR to root..."
            cp -rf "$DIR"/* . || true
          fi
        fi

        # Ensure gradle.properties exists
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonFinalResIds=true
        EOF

        # Ensure root build.gradle.kts exists and uses exact plugin declarations
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FramePilot-APK
        path: app/build/outputs/apk/debug/*.apk
