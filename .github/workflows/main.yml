name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract zip file if present
      run: |
        echo "Looking for zip files..."
        ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE. Extracting..."
          unzip -o "$ZIP_FILE" -d .
        fi
        
        # Move project files to root if nested
        GRADLE_FILE=$(find . -mindepth 2 -maxdepth 3 -name "settings.gradle.kts" -o -name "build.gradle.kts" | head -n 1)
        if [ -n "$GRADLE_FILE" ]; then
          TARGET_DIR=$(dirname "$GRADLE_FILE")
          if [ "$TARGET_DIR" != "." ]; then
            echo "Moving files from $TARGET_DIR to root..."
            cp -rn "$TARGET_DIR"/* . || true
          fi
        fi

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FramePilot-Android-APK
        path: app/build/outputs/apk/debug/app-debug.apk
